<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 强制手机浏览器按 1:1 比例渲染，防止手机端排版错乱 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>网站导航与实时测速</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --container-bg: #ffffff;
            --text-main: #2c3e50;
            --text-sub: #888888;
            --border-color: #eeeeee;
            --primary-btn: #3498db;
            --primary-btn-hover: #2980b9;
            --shadow-color: rgba(0,0,0,0.05);
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg-color); 
            margin: 0; 
            padding: 12px; 
            color: var(--text-main); 
            -webkit-tap-highlight-color: transparent; 
        }
        
        .container { 
            max-width: 600px; 
            margin: 15px auto; 
            background: var(--container-bg); 
            padding: 20px 15px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px var(--shadow-color); 
            box-sizing: border-box;
        }

        h1 { margin: 0 0 5px 0; font-size: 20px; text-align: center; }
        .subtitle { color: var(--text-sub); font-size: 13px; margin-bottom: 20px; text-align: center; }
        .tips { background: #ebf5fb; color: #2980b9; padding: 12px 10px; border-radius: 6px; font-size: 13px; margin-bottom: 20px; font-weight: bold; text-align: center; line-height: 1.5; }

        .btn-test { 
            display: block; width: 100%; padding: 14px 10px; 
            background: var(--primary-btn); color: white; 
            border: none; border-radius: 8px; font-size: 16px; 
            cursor: pointer; font-weight: bold; text-decoration: none;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.25);
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 10px;
        }
        .btn-test:hover { background: var(--primary-btn-hover); }
        .btn-test:disabled { background: #bdc3c7; color: #7f8c8d; cursor: not-allowed; box-shadow: none; }
        .btn-test:active:not(:disabled) { transform: scale(0.98); } 

        ul { list-style: none; padding: 0; margin: 20px 0 0 0; border-top: 1px dashed var(--border-color); padding-top: 15px; }
        
        li { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 14px 5px; 
            border-bottom: 1px solid var(--border-color); 
            gap: 12px; 
        }
        li:last-child { border-bottom: none; }
        
        /* 聚合网站主体链接区域 */
        .site-info {
            flex: 1;
            min-width: 0; 
            display: flex;
            align-items: center;
            text-decoration: none; 
        }

        .site-link { 
            color: var(--text-main); 
            font-weight: bold; 
            font-size: 14px;
            white-space: nowrap;
            margin-right: 8px;
        }
        
        /* 鼠标悬停时名称和网址一起变色提示可点击 */
        .site-info:hover .site-link,
        .site-info:hover .url-text { 
            color: #3498db; 
        }

        .url-text {
            font-size: 12px;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 280px; 
            transition: color 0.2s;
        }
        
        .speed { 
            font-weight: bold; 
            padding: 4px 0; 
            border-radius: 4px; 
            font-size: 11px; 
            width: 65px; 
            text-align: center;
            flex-shrink: 0; 
        }
        .pending { color: #7f8c8d; background: rgba(127,140,141,0.12); }
        .fast { color: #27ae60; background: rgba(39, 174, 96, 0.12); }
        .slow { color: #c0392b; background: rgba(192, 57, 43, 0.12); }
    </style>
</head>
<body>

<div class="container">
    <h1 id="title-text">网址导航与测速---众&nbsp;彩</h1>
    <div class="subtitle">建议按下 Ctrl + D 收藏本页，永不迷路</div>
    
    <!-- 提示框重新润色，加入点击提示 -->
    <div id="status-tips" class="tips">
        📢 正在自动探测线路状态...<br>温馨提示：点击对应网址可直接打开网站
    </div>
    
    <!-- 重新测速按钮 -->
    <button id="main-btn" class="btn-test" onclick="startTest()">重新测速</button>

    <ul id="site-list">
        <!-- 自动渲染 -->
    </ul>
</div>
<div class="container">
    <p style="font-size:18px; font-weight:bold">说明：</p>
	<p style="font-size:12px;">&nbsp;&nbsp;&nbsp;&nbsp;1.导航站内网址不定期更新，保存导航站避免迷路</p>
	<p style="font-size:12px;">&nbsp;&nbsp;&nbsp;&nbsp;2.网站内容较多，每一个网址首次访问加载较慢，加载完成后再次访问会很流畅</p>
	<p style="font-size:12px;">&nbsp;&nbsp;&nbsp;&nbsp;3.大陆部分地区运营商屏蔽域名严重，如果无法打开网址，可尝试更改您的设备DNS后再试，修改DNS方法请点击：<a href="changeDNS.html" style="font-size:15px; color:green">修改DNS</a></p>
</div>
<script>
    // 在这里自由修改和配置你的网址
    let sites = [
        { name: "网址", url: "https://www.gdvnpf.com:17888" },
        { name: "网址", url: "https://www.bxdz6.com:17888" },
		{ name: "网址", url: "https://www.0ozwk.com:17888" },
		{ name: "网址", url: "https://www.iq6d4be.com:17888" },
		{ name: "网址", url: "https://www.kytlm.com:17888" }
    ];

    const COOLDOWN_TIME = 8; // 测速冷却周期（秒）

    // 动态渲染列表
    function renderList() {
        const listContainer = document.getElementById('site-list');
        listContainer.innerHTML = '';
        sites.forEach((site, index) => {
            listContainer.innerHTML += `
                <li>
                    <a href="${site.url}" target="_blank" class="site-info" title="点击访问 ${site.url}">
                        <span class="site-link">${site.name}</span>
                        <span class="url-text">${site.url}</span>
                    </a>
                    <span id="speed-${index}" class="speed pending">测速中...</span>
                </li>
            `;
        });
    }

    function pingSite(site, index) {
        return new Promise(async (resolve) => {
            const startTime = performance.now();
            try {
                const controller = new AbortController();
                const id = setTimeout(() => controller.abort(), 3500);
                
                await fetch(site.url, { mode: 'no-cors', cache: 'no-store', signal: controller.signal });
                clearTimeout(id);
                
                const endTime = performance.now();
                site.delay = Math.round(endTime - startTime);
            } catch (err) {
                site.delay = 9999; 
            }
            updateSingleSpeedDisplay(index);
            resolve();
        });
    }

    function updateSingleSpeedDisplay(index) {
        const speedTag = document.getElementById(`speed-${index}`);
        if (!speedTag) return;
        const site = sites[index];

        if (site.delay === 9999) {
            speedTag.className = 'speed slow';
            speedTag.innerText = '超时/断';
        } else {
            speedTag.innerText = `${site.delay}ms`;
            if (site.delay <= 400) speedTag.className = 'speed fast';
            else if (site.delay <= 900) speedTag.className = 'speed pending';
            else speedTag.className = 'speed slow';
        }
    }

    // 触发批量并发测速与按钮冷却控制
    async function startTest() {
        const btn = document.getElementById('main-btn');
        const tips = document.getElementById('status-tips');
        btn.disabled = true;
        btn.innerText = "正在全力测速中，请稍候...";

        // 重置状态
        sites.forEach((site, index) => {
            site.delay = 0;
            const tag = document.getElementById(`speed-${index}`);
            if (tag) { tag.className = 'speed pending'; tag.innerText = '测速中...'; }
        });

        const promises = sites.map((site, index) => pingSite(site, index));
        await Promise.all(promises);

        // 测速完成后进入倒计时
        let timeLeft = COOLDOWN_TIME;
        tips.innerHTML = "✅ 线路检测已完成！<br>温馨提示：点击对应网址可直接打开网站";
        
        const countdownTimer = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(countdownTimer);
                btn.disabled = false;
                btn.innerText = "重新测速";
            } else {
                btn.innerText = `请稍候... 重新测速 (${timeLeft}秒)`;
                timeLeft--;
            }
        }, 1000);
    }

    window.onload = () => {
        renderList();
        startTest();
    };
</script>

</body>
</html>
